name: Mettre à jour les classements FFTA

on:
  workflow_dispatch:
    inputs:
      saison:
        description: Saison
        required: true
        type: string
      sexe:
        description: Sexe
        required: true
        type: choice
        options:
          - Homme
          - Femme
      categorie:
        description: Catégorie d'âge
        required: true
        type: choice
        options:
          - U11
          - U13
          - U15
          - U18
          - U21
          - Senior 1
          - Senior 2
          - Senior 3
      arme:
        description: Arme
        required: true
        type: choice
        options:
          - Arc Classique
          - Arc à Poulies
          - Arc Nu

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  classement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FFTA_SAISON: ${{ inputs.saison }}
      FFTA_SEXE: ${{ inputs.sexe }}
      FFTA_CATEGORIE: ${{ inputs.categorie }}
      FFTA_ARME: ${{ inputs.arme }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Récupérer le niveau FFTA - Federation
        run: python Generation-Classement-FFTA.py --scope federation

      - name: Récupérer le niveau FFTA - Regional
        run: |
          python Generation-Classement-FFTA.py --scope regional

      - name: Récupérer le niveau FFTA - Departemental
        run: |
          python Generation-Classement-FFTA.py --scope departemental

      - name: Consolidation du classement final
        run: python Generation-Classement-FFTA.py --merge

      - name: Vérifier le JSON final
        run: |
          python - <<'PY'
          import glob, json, os, sys
          files = glob.glob("Classement_FFTA_*.json")
          if not files:
              print("Aucun JSON final trouvé.")
              sys.exit(1)
          for path in files:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              if not isinstance(data.get("classement"), list):
                  raise SystemExit(f"JSON invalide : {path}")
              print(f"OK : {path} ({len(data['classement'])} archers)")
          PY

      - name: Publication du JSON final dans le dépôt
        run: |
          rm -rf .ffta_raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.json'
          # Identifiants de pages découverts par le script (ffta_ids.txt)
          [ -f ffta_ids.txt ] && git add ffta_ids.txt
          git add -u
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Mise à jour du classement FFTA"
            git push
          fi

      - name: Préparation GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publication GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
