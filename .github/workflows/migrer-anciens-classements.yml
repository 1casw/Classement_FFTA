name: Migrer les anciens classements

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Déplacer les anciens JSON vers la branche data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          anciens=(Classement_FFTA_*.json)
          if [ ${#anciens[@]} -eq 0 ]; then
            echo "Aucun ancien classement à déplacer."
            exit 0
          fi

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone --branch data --single-branch "$REMOTE" data-branch
          else
            git init -b data data-branch
            git -C data-branch remote add origin "$REMOTE"
          fi

          # Copie vers la branche data (sans écraser un fichier déjà présent)
          mkdir -p data-branch/classements
          cp -n "${anciens[@]}" data-branch/classements/

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd data-branch
          git add classements
          if git diff --cached --quiet; then
            echo "Rien de nouveau dans la branche data."
          else
            git commit -m "Ajout des anciens classements FFTA"
            git push origin data
          fi
          cd ..

          # Retrait des fichiers de la racine de main
          git rm "${anciens[@]}"
          git commit -m "Retrait des anciens classements de main"
          git push
